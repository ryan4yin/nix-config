# Shared dsh policy. Linked to ~/.dsh/cordis.patch.yml and applied as the
# $DSH_HOME ("home") layer, after each profile's own patch, so it covers every
# profile and surface. dsh only reads it — keep runtime preferences and local
# model routes in the profile patch (see README.md).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V41-Flash
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history
        toolUpdate: addition-only
        contextWindow: 400000
        maxTokens: 32000
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description:
          Stronger agentic coding, knowledge, and difficult reasoning; suited to complex or
          quality-critical tasks at higher cost.
        contextWindow: 500000
        inputModalities:
          - text
- id: llm-deepseek-account
  name: "@deepseek-ai/dsh-llm-deepseek-account"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V41-Flash
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history
        toolUpdate: addition-only
        contextWindow: 400000
        maxTokens: 32000
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description:
          Stronger agentic coding, knowledge, and difficult reasoning; suited to complex or
          quality-critical tasks at higher cost.
        contextWindow: 500000
        inputModalities:
          - text
- id: agent-loop
  name: "@deepseek-ai/dsh-agent-loop"
  config:
    agents: []
    maxParallelToolCalls: 8
- id: subagent
  name: "@deepseek-ai/dsh-subagent"
  config:
    maxActiveSubagents: 3
