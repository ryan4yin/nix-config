name: Mirror this repo to Gitee
on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Pin the Gitee host key
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/known_hosts <<'HOSTS'
          gitee.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEKxHSJ7084RmkJ4YdEi5tngynE8aZe2uEoVVsB/OvYN
          gitee.com ssh-rsa 
          HOSTS
          chmod 600 ~/.ssh/known_hosts

      - name: Mirror repo to Gitee
        id: mirror-to-gitee
        shell: bash
        env:
          INPUT_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_GITEE_MIRROR }}
          INPUT_TARGET_REPO_URL: git@gitee.com:ryan_yin/nix-config.git
        run: |
          set -eu

          echo "$INPUT_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git remote add mirror "$INPUT_TARGET_REPO_URL"
          git push --tags --force --prune mirror "refs/remotes/origin/*:refs/heads/*"
